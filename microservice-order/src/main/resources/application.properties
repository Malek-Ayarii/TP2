spring.application.name=microservice-order

# Port du microservice Order
server.port=8089

# Configuration de la base de donnees H2 (en memoire)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:order-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Le nom de table "order-db" contient un tiret : Hibernate doit mettre les
# identifiants entre guillemets pour que le SQL genere soit valide pour H2.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
